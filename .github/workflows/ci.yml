name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# The engine is a deterministic pure reducer, so CI is fully reproducible:
# the same seeds produce byte-identical states. One job, npm cached.
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ONE canonical gate (package.json `verify` = tsc + the dev:* proof suite +
      # combat-parity + vitest). Same command a developer runs locally, so the
      # engine's 50+ proof scripts can never silently rot opt-in — CI and local
      # share a single source of truth. Each proof exits non-zero on failure.
      - name: Verify (typecheck + proofs + tests)
        run: npm run verify
