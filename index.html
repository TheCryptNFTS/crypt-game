<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0D" />
    <!-- Self-hosted fonts (@font-face in src/index.css). No render-blocking 3rd-party CSS.
         Preload the above-the-fold brand/display face. -->
    <link rel="preload" href="/fonts/clash-display-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CRYPT" />
    <title>CRYPT · a dark collectible card game</title>

    <!-- Open Graph / link-unfurl card for shared Snap challenge links.
         STATIC by design: this is a Vite SPA behind a catch-all rewrite, so
         crawlers (which don't run JS) get the same tags on every route and
         query strings can't vary metadata without a serverless function. A
         shared /snap?seed=… or /snap?daily=… therefore unfurls as this
         premium black/gold "Crypt Trial — Beat My Seed" card rather than a
         bare URL. Palette: black/gold/bone only; no emoji, no price/token copy. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CRYPT · a dark collectible card game" />
    <meta property="og:title" content="Crypt Trial — Beat My Seed" />
    <meta property="og:description" content="Same deck. Same draw. Same opponent. One seed, one match — beat it." />
    <meta property="og:url" content="https://play.freeloncity.com/" />
    <meta property="og:image" content="https://play.freeloncity.com/crypt-trial-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CRYPT TRIAL — Beat my seed. Same deck. Same draw. Same opponent." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Crypt Trial — Beat My Seed" />
    <meta name="twitter:description" content="Same deck. Same draw. Same opponent. One seed, one match — beat it." />
    <meta name="twitter:image" content="https://play.freeloncity.com/crypt-trial-og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- NO service-worker registration. public/sw.js is a kill-switch kept
         deployed only to free legacy clients still holding the old offline-shell
         SW; registering it creates an infinite install→unregister→reload loop
         (incident 2026-06-11). Do not re-add registration. -->
  </body>
</html>
